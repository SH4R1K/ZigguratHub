services:
  server:
    build:
      context: ./server
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
      OPENROUTER_USE_PROXY: ${OPENROUTER_USE_PROXY:-}
      OPENROUTER_PROXY_URL: ${OPENROUTER_PROXY_URL:-}
      # Фронт в Docker раздаётся на http://localhost:8080
      Cors__AllowedOrigins__0: http://localhost:8080
    ports:
      - "5080:8080"
    # Для Linux: резолв host.docker.internal в IP хоста (нужен для OPENROUTER_PROXY_URL=socks5://host.docker.internal:...)
    # На Windows/Mac Docker Desktop работает нативно, раскомментируй только при необходимости.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    restart: unless-stopped

  client:
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped